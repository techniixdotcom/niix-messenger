[versions]
agp = "8.13.2"
# Held at 2.2.21. Kotlin 2.4.20 is the current stable release, but the Kotlin version is
# constrained by the Android Gradle Plugin, not chosen freely -- AGP 8.13.2 does not declare
# support for 2.4.x, and a mismatch surfaces as obscure compiler-plugin failures rather than a
# clear message. Moving Kotlin means moving AGP first, which is its own upgrade.
kotlin = "2.2.21"
coroutines = "1.11.0"
coreKtx = "1.13.1"
appcompat = "1.7.0"
swiperefreshlayout = "1.2.0"
material = "1.12.0"
activity = "1.9.3"
drawerlayout = "1.2.0"
lifecycle = "2.8.7"
libsignal = "0.102.0"
# Held at 4.17.0 deliberately. 4.18.0 declares a minimum compileSdk of 37, which this project
# cannot reach without first moving to an Android Gradle Plugin that supports API 37 -- 8.13.2
# tops out at 36. Bumping it alone fails the build outright at checkReleaseAarMetadata. Moving
# to 4.18.0 is an AGP + compileSdk upgrade with its own regression surface, not a version bump.
sqlcipher = "4.17.0"
androidxSqlite = "2.4.0"
# Held at 1.15.0. tink-java has since reached 1.23.x, but this project uses tink-android, whose
# artifact versions track separately, and the gap spans enough releases that the streaming-AEAD
# API used for attachment encryption may have changed. Attachments are encrypted with this, so an
# upgrade needs its round-trip verified against files written by the old version -- an existing
# attachment that cannot be decrypted after an update is unrecoverable data loss, not a bug that
# can be patched afterwards.
tink = "1.15.0"
bouncycastle = "1.85.2"
# Native Argon2 (MIT, JNI around the reference C implementation). Only used after it has matched
# BouncyCastle's output on the device; see PassphraseKdf.
argon2kt = "1.6.0"
zxing = "3.5.4"
desugarJdkLibs = "2.1.5"
kmpTorRuntime = "2.6.0"
kmpTorResource = "409.5.0"
zxingEmbedded = "4.3.0"
exifinterface = "1.4.2"
junit = "4.13.2"
# Linux desktop build (desktop/). Its Kotlin isn't tied to the Android Gradle Plugin, so it can be the
# current release; Java-GI needs JDK 25 and Kotlin 2.4 is the first to target it fully.
kotlinDesktop = "2.4.21"
javaGi = "1.0.0-RC3"
sqliteJdbcCrypt = "3.53.4.0"
tinkJava = "1.24.0"
flatpakGradleGenerator = "1.9.0"
androidxJunit = "1.2.1"
espresso = "3.6.1"
robolectric = "4.16.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-drawerlayout = { group = "androidx.drawerlayout", name = "drawerlayout", version.ref = "drawerlayout" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

libsignal-android = { group = "org.signal", name = "libsignal-android", version.ref = "libsignal" }
libsignal-client = { group = "org.signal", name = "libsignal-client", version.ref = "libsignal" }

sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "androidxSqlite" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
argon2kt = { group = "com.lambdapioneer.argon2kt", name = "argon2kt", version.ref = "argon2kt" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
kmp-tor-runtime = { module = "io.matthewnelson.kmp-tor:runtime", version.ref = "kmpTorRuntime" }
kmp-tor-resource-exec-tor = { module = "io.matthewnelson.kmp-tor:resource-exec-tor", version.ref = "kmpTorResource" }
zxing-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingEmbedded" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

javagi-adw = { group = "org.java-gi", name = "adw", version.ref = "javaGi" }
javagi-secret = { group = "org.java-gi", name = "secret", version.ref = "javaGi" }
javagi-gstreamer = { group = "org.java-gi", name = "gstreamer", version.ref = "javaGi" }
sqlite-jdbc-crypt = { group = "io.github.willena", name = "sqlite-jdbc", version.ref = "sqliteJdbcCrypt" }
tink-java = { group = "com.google.crypto.tink", name = "tink", version.ref = "tinkJava" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm-desktop = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinDesktop" }
flatpak-gradle-generator = { id = "io.github.jwharm.flatpak-gradle-generator", version.ref = "flatpakGradleGenerator" }
