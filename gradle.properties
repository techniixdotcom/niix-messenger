org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# More patience for dependency downloads. Gradle gives up after 30 seconds of silence, which a
# slow connection or busy Maven server easily hits. Only matters when something is downloaded.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
