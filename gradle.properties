org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Network tolerance for dependency downloads.
#
# Gradle's defaults give up after 30 seconds without data and retry only briefly. A slow
# connection or a busy Maven server exceeds that, and the build fails with "Read timed out" part
# way through, having compiled nothing wrong. These give each request two minutes and more
# attempts. Only first builds and dependency changes download anything; later builds use the
# local cache, so this costs nothing when the network is fine.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
